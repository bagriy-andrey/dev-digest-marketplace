name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".claude-plugin/marketplace.json"
      - "scripts/build-index.mjs"
      - "browser/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build search index
        run: node scripts/build-index.mjs

      - name: Upload index artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-index
          path: site/index.json

  build-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: browser/package-lock.json

      - name: Install dependencies
        working-directory: browser
        run: npm ci

      - name: Build browser app
        working-directory: browser
        run: npm run build

      - name: Upload browser app artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-browser
          path: site/browser/

  deploy:
    runs-on: ubuntu-latest
    needs: [build-index, build-browser]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download index artifact
        uses: actions/download-artifact@v4
        with:
          name: site-index
          path: site/

      - name: Download browser app artifact
        uses: actions/download-artifact@v4
        with:
          name: site-browser
          path: site/browser/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
